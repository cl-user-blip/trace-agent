[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent"
version = "0.1.0"
description = "Durable agent tool execution with SQLite checkpoints, bounded retries and execution traces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
authors = [{name = "cl-user-blip"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
trace-agent = "trace_agent.__main__:main"

[tool.setuptools]
packages = ["trace_agent"]

[tool.setuptools.package-data]
trace_agent = ["data/knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

